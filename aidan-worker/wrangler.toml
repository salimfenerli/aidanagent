name = "aidan-pusher"
main = "worker.js"
compatibility_date = "2025-01-01"

# Cron tetikleyiciler — TEK cron (Agu 2026).
# Cloudflare ucretsiz plan worker basina 3 trigger kabul ediyor; burada 9 tanimliyken
# fazlasi HIC kaydolmamis ve takviye/blok/deadline/haftalik/borsa/portfoy/yedek
# cron'lari aylardir calismamisti. Artik tek tetikleyici var, hangi isin vakti
# geldigine TR saatine gore worker.js icindeki scheduled() karar veriyor.
[triggers]
crons = [
  "*/5 * * * *",  # TEK TETIKLEYICI — is dagitimi worker.js scheduled() icinde
]

# NOT: Environment değişkenlerini KOD'A YAZMA.
# Cloudflare Dashboard'dan Worker → Settings → Variables and Secrets'tan ekle:
#   SUPABASE_URL        (Plaintext)
#   SUPABASE_KEY        (Plaintext)
#   AIDAN_EMAIL         (Plaintext)
#   AIDAN_PASSWORD      (Secret)
#   WEBHOOK_SECRET      (Secret)  — manuel cron test auth
#   VAPID_PUBLIC_KEY    (Plaintext)
#   VAPID_PRIVATE_KEY   (Secret)  — web push imzalama
