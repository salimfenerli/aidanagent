name = "aidan-pusher"
main = "worker.js"
compatibility_date = "2025-01-01"

# Cron tetikleyiciler — Cloudflare UTC kullanır (TR = UTC+3)
[triggers]
crons = [
  "0 5 * * *",   # 08:00 TR — sabah brifingi
  "0 6 * * *",   # 09:00 TR — deadline uyarısı
  "0 9 * * *",   # 12:00 TR — öğle ping
  "0 18 * * *",  # 21:00 TR — akşam özet
  "0 18 * * SUN",  # Pazar 21:00 TR — haftalık review (AI yorumlu)
  "*/30 7-15 * * 1-5",  # BIST saatleri (10-18 TR, hafta içi) — borsa alarm kontrol
  "30 15 * * 1-5",  # 18:30 TR hafta içi — akşam portföy özeti (BIST kapanışı sonrası)
  "*/15 * * * *",  # 15 dk'da bir — sabit hatırlatıcı kontrolü (ilaç/su/ders, data.reminders)
]

# NOT: Environment değişkenlerini KOD'A YAZMA.
# Cloudflare Dashboard'dan Worker → Settings → Variables and Secrets'tan ekle:
#   SUPABASE_URL        (Plaintext)
#   SUPABASE_KEY        (Plaintext)
#   AIDAN_EMAIL         (Plaintext)
#   AIDAN_PASSWORD      (Secret)
#   WEBHOOK_SECRET      (Secret)  — manuel cron test auth
#   VAPID_PUBLIC_KEY    (Plaintext)
#   VAPID_PRIVATE_KEY   (Secret)  — web push imzalama
