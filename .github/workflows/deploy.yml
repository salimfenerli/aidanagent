name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'asistan.html'
      - 'core.js'
      - 'tasks.js'
      - 'ui.js'
      - 'program.js'
      - 'nutrition.js'
      - 'health.js'
      - 'supabase.js'
      - 'html5-qrcode.min.js'
      - 'styles.css'
      - '404.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.png'
      - 'icon-maskable.png'
      - 'icon.svg'
      - 'icon-maskable.svg'
      - '_headers'
      - '_redirects'
      - 'aidan-pages-deploy.py'
      - 'borsa/**'
      - 'borsa-pages-deploy.py'
      - 'aidan-worker/worker.js'
      - 'aidan-worker/deploy.py'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ⚠️ 12 Agu 2026: 20 test dosyasi × jsdom penceresi. Varsayilan paralellikte
    # (CPU sayisi kadar) GitHub runner'inda bellek yetmeyip is dusebiliyor —
    # o zaman TESTLER degil DEPLOY'UN TAMAMI bloke olur ve sessizce eski surum
    # canlida kalir. Sure ve paralellik bilincli olarak gevsetildi.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 9 Agu 2026: eskiden testler CI'da HIC calismiyordu — 200+ test yazilmis
      # ama kirmizi testle canliya cikilabiliyordu. Artik test gecmeden deploy YOK.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ⚠️ 14 Agu 2026 — HATA ARTIK KENDINI RAPORLAR.
      # 9 Agu'dan beri her deploy kirmiziydi ve sebep yalnizca ham log'un
      # icinde goruluyordu; Salim oraya ulasamadigi icin hata HAFTALARCA
      # tespit edilemedi (canlida sessizce v7-134 kaldi).
      # Artik her adim id'li ve basarisizlikta ozet Summary sayfasina yazilir —
      # yani ilk acilan ekranda gorunur, log kazmaya gerek yok.
      - name: Install test deps
        id: deps
        run: npm ci || npm install

      - name: Run tests
        id: tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log

      - name: Syntax check
        id: syntax
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/check.log

      - name: Hata raporu (Summary sayfasinda gorunur)
        if: failure()
        run: |
          {
            echo "## Deploy durdu"
            echo ""
            echo "| Adim | Sonuc |"
            echo "|---|---|"
            echo "| Bagimlilik kurulumu | ${{ steps.deps.outcome }} |"
            echo "| Testler | ${{ steps.tests.outcome }} |"
            echo "| Sozdizimi | ${{ steps.syntax.outcome }} |"
            echo ""
            echo "(bos hucre = o adima hic sira gelmedi)"
            echo ""
            if [ -f /tmp/test.log ]; then
              echo "### Test ciktisi"
              echo '```'
              grep -E "^not ok|^# fail|Error|error:|Cannot find" /tmp/test.log | head -40 || tail -40 /tmp/test.log
              echo '```'
            else
              echo "### Testler hic calismadi"
              echo "Bagimlilik kurulumu (npm ci / npm install) patlamis olabilir."
            fi
            if [ -f /tmp/check.log ]; then
              echo "### Sozdizimi ciktisi"
              echo '```'
              tail -20 /tmp/check.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install httpx
        run: pip install httpx

      - name: Deploy to Cloudflare Pages
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: dd37c3eb3e7fbab35ee16f1a6db4cce1
        run: python aidan-pages-deploy.py

      # Borsa ayri bir Pages projesi (kendi URL'i, kendi PWA'si).
      # ⚠️ Ayri adim olmasi ONEMLI: biri patlarsa digeri yayindan dusmez.
      # Ayni testlerden geciyorlar (npm test ikisini de kapsar).
      - name: Deploy Borsa to Cloudflare Pages
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: dd37c3eb3e7fbab35ee16f1a6db4cce1
        run: python borsa-pages-deploy.py

      # Worker'ı da deploy et — worker.js degisince /ai, push, cron guncellenir.
      # Secret'lar (SUPABASE/TELEGRAM/VAPID) env'de verilmez → deploy.py atlar,
      # Cloudflare'deki mevcut secret'lar KORUNUR (sadece kod + cron guncellenir).
      - name: Deploy Worker
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: dd37c3eb3e7fbab35ee16f1a6db4cce1
        run: python aidan-worker/deploy.py
