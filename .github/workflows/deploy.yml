name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'asistan.html'
      - 'core.js'
      - 'tasks.js'
      - 'stocks.js'
      - 'ui.js'
      - 'program.js'
      - 'nutrition.js'
      - 'supabase.js'
      - 'html5-qrcode.min.js'
      - 'styles.css'
      - '404.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.png'
      - 'icon-maskable.png'
      - 'icon.svg'
      - 'icon-maskable.svg'
      - '_headers'
      - '_redirects'
      - 'aidan-pages-deploy.py'
      - 'aidan-worker/worker.js'
      - 'aidan-worker/deploy.py'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # test adimi eklendi (jsdom yuklemeleri sure alir)
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 9 Agu 2026: eskiden testler CI'da HIC calismiyordu — 200+ test yazilmis
      # ama kirmizi testle canliya cikilabiliyordu. Artik test gecmeden deploy YOK.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test deps
        run: npm ci || npm install

      - name: Run tests
        run: npm test

      - name: Syntax check
        run: npm run check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install httpx
        run: pip install httpx

      - name: Deploy to Cloudflare Pages
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: dd37c3eb3e7fbab35ee16f1a6db4cce1
        run: python aidan-pages-deploy.py

      # Worker'ı da deploy et — worker.js degisince /ai, push, cron guncellenir.
      # Secret'lar (SUPABASE/TELEGRAM/VAPID) env'de verilmez → deploy.py atlar,
      # Cloudflare'deki mevcut secret'lar KORUNUR (sadece kod + cron guncellenir).
      - name: Deploy Worker
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: dd37c3eb3e7fbab35ee16f1a6db4cce1
        run: python aidan-worker/deploy.py
