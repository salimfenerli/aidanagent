# Aidan — Netlify yapılandırması
# Tek dosya HTML PWA, build gerekmiyor

[build]
  publish = "."

# /CLAUDE.md ve /aidan-mcp/* yollarını 404 göster (özel notlar gizli kalsın)
[[redirects]]
  from = "/CLAUDE.md"
  to = "/asistan.html"
  status = 404

[[redirects]]
  from = "/aidan-mcp/*"
  to = "/asistan.html"
  status = 404

[[redirects]]
  from = "/aidan-worker/*"
  to = "/asistan.html"
  status = 404

[[redirects]]
  from = "/.env*"
  to = "/asistan.html"
  status = 404

[[redirects]]
  from = "/.git*"
  to = "/asistan.html"
  status = 404

[[redirects]]
  from = "/.claude/*"
  to = "/asistan.html"
  status = 404

# Güvenlik başlıkları — tüm yollar için
[[headers]]
  for = "/*"
  [headers.values]
    # Tarayıcı bizi başkasının iframe'inde göstermesin — clickjacking koruması
    X-Frame-Options = "DENY"
    # MIME type sniffing'i kapat
    X-Content-Type-Options = "nosniff"
    # Referer header'ı gönderirken sadece origin (sayfa yolu sızdırma)
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Tarayıcı API'lerine kısıtlama (kamera, mikrofon, vs.)
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=(), usb=()"
    # HTTPS'i zorla, 1 yıl, alt domain'ler dahil
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # XSS savunması — daha eski tarayıcılar için
    X-XSS-Protection = "1; mode=block"
    # CORS — kendi origin'imize kilitle
    Cross-Origin-Opener-Policy = "same-origin"
    # Content Security Policy — yalnız beklenen kaynaklara izin ver
    # Supabase CDN (jsdelivr), Supabase REST/WSS, Cloudflare Worker, Telegram link
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://aidan-pusher.fenerlisalim04.workers.dev https://api.telegram.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self';"
